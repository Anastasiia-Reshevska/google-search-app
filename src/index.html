<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test assignment for INIZIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.scss" />
</head>

<body>
  <main>
    <div class="form-search">
      <form id="form" class="form-search__container">
        <h1 class="form-search__title">Search phrase</h1>
        <div class="form-search__wrapper">
          <label for="input">Search phrase</label>
          <input id="input" type="search" placeholder="Enter a search phrase" maxlength="200" required />
          <button class="form-search__btn" id="search-button" type="submit">Search</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <button class="form-search__btn" id="download" type="button" hidden>Download JSON</button>
      <ol id="results"></ol>
    </div>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>

</html>
